<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魂龍 – 本格豚骨ラーメンキット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero-section">
    <div class="hero-inner">
      <p class="hero-label">魂龍 公式オンラインショップ</p>
      <h1 class="hero-catch">あの行列の味を、<br>おうちの食卓へ。</h1>
      <p class="hero-sub">魂龍の本格豚骨ラーメンキット&emsp;4人前・冷凍&emsp;2,800円（送料込み）</p>
      <a href="#order" class="hero-cta">今すぐ注文する</a>
    </div>
  </section>

  <section class="empathy-section">
    <div class="empathy-inner">
      <h2 class="empathy-heading">こんなお悩みありませんか？</h2>
      <div class="empathy-cards">
        <div class="empathy-card">
          <span class="empathy-icon">🍜</span>
          <p class="empathy-text">本格豚骨ラーメンを食べたいけど、<br>店まで行けない</p>
        </div>
        <div class="empathy-card">
          <span class="empathy-icon">🎁</span>
          <p class="empathy-text">大切な人へのギフトに<br>悩んでいる</p>
        </div>
        <div class="empathy-card">
          <span class="empathy-icon">😤</span>
          <p class="empathy-text">市販のラーメンでは<br>物足りない</p>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
